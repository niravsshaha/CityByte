<!doctype html>
<html lang="en">
<head>
    <title>CityByte</title>

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- CSS only -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-iYQeCzEYFbKjA/T2uDLTpkwGzCiq6soy8tYaI1GyVh/UjpbCx/TYkiZhlZB6+fzT" crossorigin="anonymous">

    <style>
        body {
            padding: 0;
            margin: 0;
            border: none;
            background-color: #3F3F3F;
        }

        .container {
            margin: auto;
        }

        .search-box, .search-box-suggestion {
            position: absolute;
            top: 30vh;
        }

        .search-box-suggestion {
            overflow: hidden;
        }

        #query, #suggestion, #suggestion-before, #suggestion-after {
            /*position: absolute;*/
            font-size: 10rem;
            color: #f5f9e9;
        }

        #suggestion, #suggestion-before, #suggestion-after {
            /*overflow: hidden;*/

            z-index: 1;
        }

        #query {
            background: transparent;

            padding: 0;

            color: transparent;
            border-color: inherit;
            -webkit-box-shadow: none;
            box-shadow: none;
            caret-color: transparent;

            z-index: 2;
        }
    </style>

</head>
<body>
<!-- JavaScript Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-u1OknCvxWvY5kfmNBILK2hRnQC3Pr17a+RTT6rIHI7NnikvbZlHgTPOOmMi466C8" crossorigin="anonymous"></script>

<nav class="navbar navbar-dark bg-dark">
    <a class="navbar-brand" href="#" style="font-size: 3rem; font-weight: bolder; padding: 1rem 3rem;">
        CityByte
    </a>
</nav>

<div class="container">
    <div class="search-box"><input type="text" class="form-control" id="query" spellcheck="false" autocomplete="off" onkeyup="getSuggestions(event)" placeholder="Type a city"></div>
    <div class="search-box-suggestion"><span id="suggestion-before"></span><span id="suggestion"></span><span id="suggestion-after"></span></div>
</div>

<script>
    var timeout = null;
    var timeout1 = null;

    function reflectSuggestions(city, citiesJSON) {
        let citySuggestions = JSON.parse(citiesJSON).results;

        if (citySuggestions.length !== 0) {
            let cityFirstSuggestion = citySuggestions[0].name;

            clearTimeout(timeout1);
            timeout1 = setTimeout(getCityPhoto, 100, cityFirstSuggestion, citySuggestions[0].geonames_id, updateBackground);

            document.getElementById('suggestion-before').innerHTML = cityFirstSuggestion.slice(0, cityFirstSuggestion.indexOf(city));
            document.getElementById('suggestion-after').innerHTML = cityFirstSuggestion.slice(cityFirstSuggestion.indexOf(city) + city.length);
        }
    }

    function updateBackground(pathJSON) {
        let path = JSON.parse(pathJSON).path;

        if (path != null) {
            document.body.style.background = null;
            document.body.style.backgroundImage = "url('" + path + "')";
            document.body.style.backgroundSize = "cover";
            document.body.style.backgroundRepeat = "no-repeat";
        }
    }

    function getCityPhoto(city, geonamesId, callback1) {
        let xhr1 = new XMLHttpRequest();

        let url1 = new URL('{% url 'search:city_photo' %}', window.location.origin);
        url1.searchParams.set('q', city);
        if (geonamesId) url1.searchParams.set('id', geonamesId);

        xhr1.onload = function(e) {
            callback1(this.responseText);
        }

        xhr1.open('GET', url1, true);
        xhr1.send();
    }

    function getCityList(callback) {
        let xhr = new XMLHttpRequest();
        let city = document.getElementById("query").value;

        if (city.length === 0) {
            return;
        }

        let url = new URL('{% url 'search:city_search' %}', window.location.origin);
        url.searchParams.set('q', city);

        xhr.onload = function(e) {
            let results = [];
            try { results = JSON.parse(this.responseText).results; } catch (err) {}

            if (this.status === 200 && results.length !== 0) {
                callback(city, this.responseText);
            } else {
                getCityListFromBrowser(city, callback);
            }
        }
        xhr.onerror = function(e) {
            getCityListFromBrowser(city, callback);
        }

        xhr.open('GET', url, true);
        xhr.send();
    }

    // Fallback: ask Open-Meteo directly from the browser if our server couldn't
    // (e.g. its shared IP was rate-limited). Same response shape as /api/search/city.
    function getCityListFromBrowser(city, callback) {
        let url = new URL('https://geocoding-api.open-meteo.com/v1/search');
        url.searchParams.set('name', city);
        url.searchParams.set('count', '10');
        url.searchParams.set('language', 'en');

        fetch(url).then(function(r) { return r.json(); }).then(function(data) {
            let results = (data.results || []).map(function(c) {
                return {
                    name: c.name, region: c.admin1 || '', country: c.country || '',
                    geonames_id: c.id, latitude: c.latitude, longitude: c.longitude,
                    address: {countryCode: c.country_code || ''}
                };
            });
            callback(city, JSON.stringify({results: results}));
        }).catch(function() {});
    }

    function redict_to_info(city, citiesJSON) {
        let citySuggestions = JSON.parse(citiesJSON).results;

        if (citySuggestions.length !== 0) {
            let c = citySuggestions[0];
            let params = new URLSearchParams({
                city: c.name, country: c.address.countryCode, region: c.region || '',
                lat: c.latitude, lon: c.longitude, id: c.geonames_id || ''
            });
            location.href = "{% url "info_page" %}?" + params.toString();
        }
    }

    function clearSuggestions() {
        document.getElementById('suggestion-before').innerHTML = "";
        document.getElementById('suggestion-after').innerHTML = "";
        document.body.style.backgroundImage = null;
        document.body.style.background = "#3F3F3F";
        document.body.style.backgroundSize = null;
        document.body.style.backgroundRepeat = null;
    }

    function getSuggestions(e){
        if (e.key === 'Enter' || e.keyCode === 13) {
            getCityList(redict_to_info);
        }

        document.getElementById("query").value = document.getElementById("query").value.split(' ').map(s => s.charAt(0).toUpperCase() + s.slice(1)).join(' ');
        document.getElementById('suggestion').innerHTML =  '<b>' + document.getElementById("query").value + '</b>';
        clearSuggestions();

        clearTimeout(timeout);
        timeout = setTimeout(getCityList, 700, reflectSuggestions);
    }

    setTimeout(getSuggestions, 1000);
</script>
</body>
</html>
